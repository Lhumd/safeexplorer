<svg xmlns="http://www.w3.org/2000/svg" class="sx-diagram" viewBox="0 0 800 550" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Standard PPO update versus the SafeExplorer masked gradient</title>
  <desc id="mg-desc">A rollout of twelve timesteps from the mixed policy. The main policy acts on steps 1 to 5 and 9 to 12, the recovery policy on steps 6 to 8. A standard PPO update scores every step, including the recovery steps, as if the main policy had chosen those actions, which biases the gradient. The SafeExplorer masked gradient adds the score term, the gradient of log pi theta of a t given s t, only on main-policy steps. Recovery steps contribute no score term, so the recovery policy's action density is never evaluated. The advantage of every main step is still computed over the full trajectory, so recovery segments still enter through the return.</desc>
  <style>
    .sx-diagram,.sx-diagram text{font-family:inherit}
    .sx-diagram text.d-fg,.sx-diagram tspan.d-fg{fill:var(--c-fg,#1d2433)}
    .sx-diagram :not(text):not(tspan).d-fg{stroke:var(--c-fg,#1d2433);fill:none}
    .sx-diagram text.d-muted,.sx-diagram tspan.d-muted{fill:var(--c-muted,#5b6475)}
    .sx-diagram :not(text):not(tspan).d-muted{stroke:var(--c-muted,#5b6475);fill:none}
    .sx-diagram text.d-main,.sx-diagram tspan.d-main{fill:var(--c-main-text,#006b67)}
    .sx-diagram :not(text):not(tspan).d-main{stroke:var(--c-main,#0f8b8d);fill:none}
    .sx-diagram .d-main-fill{fill:var(--c-main,#0f8b8d)}
    .sx-diagram text.d-recovery,.sx-diagram tspan.d-recovery{fill:var(--c-recovery-text,#9a4a06)}
    .sx-diagram :not(text):not(tspan).d-recovery{stroke:var(--c-recovery,#c4610c);fill:none}
    .sx-diagram .d-recovery-fill{fill:var(--c-recovery,#c4610c)}
    .sx-diagram .d-safe-fill{fill:var(--c-safe,#0f8b8d);fill-opacity:.12}
    .sx-diagram text.d-fall,.sx-diagram tspan.d-fall{fill:var(--c-fall,#b8322a)}
    .sx-diagram :not(text):not(tspan).d-fall{stroke:var(--c-fall,#b8322a);fill:none}
    .sx-diagram .d-grid{stroke:var(--c-grid,#c9ced8);fill:none}
  </style>
  <defs>
    <pattern id="mg-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path class="d-recovery" d="M0 0V10" stroke-width="3" stroke-opacity=".45"/>
    </pattern>
    <marker id="mg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="d-main-fill" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="mg-arrow-time" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="d-grid" d="M1 1L9 5L1 9" stroke-width="2"/>
    </marker>
  </defs>

